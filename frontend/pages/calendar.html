<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5c98d2" />
  <title>To Bloom List | 月曆</title>
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="../css/base/variables.css" />
  <link rel="stylesheet" href="../css/base/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components/header.css" />
  <link rel="stylesheet" href="../css/components/sidebar.css" />
  <link rel="stylesheet" href="../css/components/footer.css" />
  <link rel="stylesheet" href="../css/pages/calendar.css" />
</head>
<body class="app-body" data-page="calendar">
  <div id="appHeader"></div>
  <div id="appSidebar"></div>
  <div id="sidebarOverlay" class="sidebar-overlay" hidden></div>

  <div class="app-content">
    <main class="app-main">
      <section class="calendar-page" aria-labelledby="calendarPageTitle">
        <header class="page-heading">
          <p class="page-eyebrow">CALENDAR JOURNAL</p>
          <h2 id="calendarPageTitle">月曆</h2>
          <p>先用真實 localStorage 任務整理月份；未來再由 n8n 統一同步至 Google Calendar。</p>
        </header>

        <article class="calendar-shell" aria-label="本月任務月曆">
          <header class="calendar-shell__header">
            <button id="previousMonth" type="button" aria-label="上一個月">←</button>
            <h3 id="calendarMonthLabel">--</h3>
            <button id="nextMonth" type="button" aria-label="下一個月">→</button>
          </header>
          <div class="calendar-weekdays" aria-hidden="true"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
          <div id="calendarGrid" class="calendar-grid" aria-label="月份日期格"></div>
        </article>

        <div class="calendar-bottom">
          <dl class="calendar-stat-grid">
            <div><dt>本月新增</dt><dd id="calendarCreatedCount">0</dd></div>
            <div><dt>本月完成</dt><dd id="calendarCompletedCount">0</dd></div>
            <div><dt>目前待完成</dt><dd id="calendarPendingCount">0</dd></div>
          </dl>
          <aside class="calendar-sync-note">
            <p class="page-eyebrow">GOOGLE CALENDAR</p>
            <h3>整合邊界已預留</h3>
            <p>此版本不會假裝已連線。任務排程、Event ID 與同步狀態已納入資料契約，待 n8n credentials 設定後啟用。</p>
            <span>目前狀態：尚未連線</span>
          </aside>
        </div>
      </section>
    </main>
    <div id="appFooter"></div>
  </div>

  <script type="module" src="../js/app.js"></script>
  <script type="module" src="../js/pages/calendar.js"></script>
</body>
</html>
