<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To Bloom List | 月曆</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/base/variables.css" />
  <link rel="stylesheet" href="../css/base/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components/header.css" />
  <link rel="stylesheet" href="../css/components/sidebar.css" />
  <link rel="stylesheet" href="../css/components/footer.css" />
  <link rel="stylesheet" href="../css/pages/calendar.css" />
</head>
<body class="app-body" data-page="calendar">
  <div id="appHeader"></div>
  <div id="appSidebar"></div>
  <div id="sidebarOverlay" class="sidebar-overlay" hidden></div>

  <div class="app-content">
    <main class="app-main">
      <section class="calendar-page" aria-labelledby="calendarPageTitle">
        <h2 id="calendarPageTitle" class="calendar-page__title">月曆</h2>
        <p class="calendar-page__desc">使用任務的 createdAt / completedAt 統計本月進度，暫不顯示假事件。</p>

        <article class="calendar-shell" aria-label="本月任務統計骨架">
          <header class="calendar-shell__header">
            <h3 id="calendarMonthLabel">--</h3>
            <p>僅顯示真實任務資料統計，不宣稱未實作功能。</p>
          </header>

          <div class="calendar-stat-grid">
            <article class="calendar-stat-card">
              <p>本月新增</p>
              <strong id="calendarCreatedCount">0</strong>
            </article>
            <article class="calendar-stat-card">
              <p>本月完成</p>
              <strong id="calendarCompletedCount">0</strong>
            </article>
            <article class="calendar-stat-card">
              <p>目前待完成</p>
              <strong id="calendarPendingCount">0</strong>
            </article>
          </div>

          <p class="calendar-empty">互動型月曆視圖尚未實作，目前先提供可驗證的真實資料摘要。</p>
        </article>
      </section>
    </main>
    <div id="appFooter"></div>
  </div>

  <script type="module" src="../js/app.js"></script>
  <script type="module" src="../js/pages/calendar.js"></script>
</body>
</html>
