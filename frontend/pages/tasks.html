<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5c98d2" />
  <title>To Bloom List | 待辦事項</title>
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="../css/base/variables.css" />
  <link rel="stylesheet" href="../css/base/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components/header.css" />
  <link rel="stylesheet" href="../css/components/sidebar.css" />
  <link rel="stylesheet" href="../css/components/footer.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/pages/tasks.css" />
</head>
<body class="app-body" data-page="tasks">
  <div id="appHeader"></div>
  <div id="appSidebar"></div>
  <div id="sidebarOverlay" class="sidebar-overlay" hidden></div>

  <div class="app-content">
    <main class="app-main">
      <section class="tasks-page" aria-labelledby="tasksPageTitle">
        <header class="page-heading">
          <p class="page-eyebrow">LIST JOURNAL</p>
          <h2 id="tasksPageTitle">待辦事項</h2>
          <p>像寫日記一樣，穩穩記下今天真正重要的四件事。</p>
        </header>

        <div class="tasks-page__grid">
          <section class="task-panel journal-sheet" aria-labelledby="tasksPanelTitle">
            <header class="journal-sheet__header journal-sheet__date">
              <div>
                <p class="page-eyebrow">TODAY · <span data-current-date>--</span></p>
                <h3 id="tasksPanelTitle">今日清單</h3>
              </div>
              <p id="taskLimitMessage" class="task-limit" aria-live="polite">今日完成 0 / 4</p>
            </header>

            <div class="task-input-group">
              <label for="taskInput" class="visually-hidden">新增任務內容</label>
              <input id="taskInput" type="text" class="task-input" maxlength="200" placeholder="寫下一件今天想完成的事…" />
              <button id="addBtn" class="task-add-btn" type="button">加入清單</button>
            </div>

            <ul id="taskList" class="task-list" aria-label="待辦任務清單"></ul>
            <p id="taskSummaryStatus" class="task-summary-status" aria-live="polite"></p>
          </section>

          <aside class="journal-margin" aria-labelledby="tasksSummaryTitle">
            <p class="page-eyebrow">TODAY'S NOTE</p>
            <h3 id="tasksSummaryTitle">今日頁角</h3>
            <dl class="journal-stats">
              <div><dt>清單總數</dt><dd id="taskTotalCount">0</dd></div>
              <div><dt>目前完成</dt><dd id="taskCompletedCount">0</dd></div>
              <div><dt>目前盛開</dt><dd id="bloomSummaryCount">0</dd></div>
              <div><dt>今日目標</dt><dd><span id="dailyCompletedCount">0</span>/4</dd></div>
            </dl>
            <div class="journal-margin__rule"></div>
            <p id="dailyRewardMessage">完成四項不同任務後，可以選擇一顆種子。</p>
            <p>選種機會：<strong id="pendingSeedCredits">0</strong></p>
            <button id="openSeedOffer" class="reward-button" type="button" hidden>前往選種</button>
          </aside>
        </div>
      </section>
      <p id="taskCompletionAnnouncer" class="visually-hidden" aria-live="polite"></p>
    </main>
    <div id="appFooter"></div>
  </div>

  <dialog id="seedOfferDialog" class="seed-dialog" aria-labelledby="seedDialogTitle">
    <form method="dialog" class="seed-dialog__top"><button class="seed-dialog__close" value="cancel" aria-label="關閉">×</button></form>
    <p class="page-eyebrow">A GIFT FOR TODAY</p>
    <h2 id="seedDialogTitle">從三顆種子中選擇一顆</h2>
    <p>選擇前只會看見花色和花語提示。</p>
    <div id="seedOfferChoices" class="seed-choice-grid"></div>
    <p id="seedOfferFeedback" class="seed-dialog__feedback" aria-live="polite"></p>
  </dialog>

  <script type="module" src="../js/app.js"></script>
  <script type="module" src="../js/pages/tasks.js"></script>
</body>
</html>
