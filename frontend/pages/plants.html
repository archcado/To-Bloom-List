<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To Bloom List | 我的植物</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/base/variables.css" />
  <link rel="stylesheet" href="../css/base/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components/header.css" />
  <link rel="stylesheet" href="../css/components/sidebar.css" />
  <link rel="stylesheet" href="../css/components/footer.css" />
  <link rel="stylesheet" href="../css/pages/plants.css" />
</head>
<body class="app-body" data-page="plants">
  <div id="appHeader"></div>
  <div id="appSidebar"></div>
  <div id="sidebarOverlay" class="sidebar-overlay" hidden></div>

  <div class="app-content">
    <main class="app-main">
      <section class="plants-page" aria-labelledby="plantsPageTitle">
        <h2 id="plantsPageTitle" class="plants-page__title">我的花園</h2>
        <p class="plants-page__desc">依目前 localStorage 任務狀態，分為「成長中」與「已盛開」。不補造歷史資料。</p>

        <div class="plants-overview" aria-label="花園總覽">
          <article class="plants-overview__card">
            <p>總植物數</p>
            <strong id="totalPlantsCount">0</strong>
          </article>
          <article class="plants-overview__card">
            <p>盛開數量</p>
            <strong id="totalBloomsCount">0</strong>
          </article>
        </div>

        <div class="plants-beds">
          <section class="plants-card" aria-labelledby="growingPlantsTitle">
            <header class="plants-card__header">
              <div>
                <p class="plants-card__eyebrow">GROWING GARDEN</p>
                <h3 id="growingPlantsTitle">成長中的花圃</h3>
              </div>
              <span id="growingPlantsCount" class="plants-card__count">0 株</span>
            </header>
            <div class="plants-bed-viewport" tabindex="0" aria-label="可橫向捲動的成長中花圃">
              <ul id="growingPlantsList" class="plants-task-list" aria-label="成長中的任務植物"></ul>
            </div>
          </section>

          <section class="plants-card" aria-labelledby="bloomPlantsTitle">
            <header class="plants-card__header">
              <div>
                <p class="plants-card__eyebrow">BLOOMING GARDEN</p>
                <h3 id="bloomPlantsTitle">已盛開的花圃</h3>
              </div>
              <span id="bloomPlantsCount" class="plants-card__count">0 株</span>
            </header>
            <div class="plants-bed-viewport" tabindex="0" aria-label="可橫向捲動的盛開花圃">
              <ul id="bloomPlantsList" class="plants-task-list" aria-label="已盛開的任務植物"></ul>
            </div>
          </section>
        </div>

        <article class="plants-roadmap" aria-label="花園後續規劃">
          <h3>Roadmap</h3>
          <p>下一階段會加入任務歷史封存與週期回顧，讓花園可以檢視長期成長軌跡。</p>
        </article>
      </section>
    </main>
    <div id="appFooter"></div>
  </div>

  <script type="module" src="../js/app.js"></script>
  <script type="module" src="../js/pages/plants.js"></script>
</body>
</html>
