<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5c98d2" />
  <title>To Bloom List | 我的花園</title>
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="../css/base/variables.css" />
  <link rel="stylesheet" href="../css/base/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components/header.css" />
  <link rel="stylesheet" href="../css/components/sidebar.css" />
  <link rel="stylesheet" href="../css/components/footer.css" />
  <link rel="stylesheet" href="../css/pages/plants.css" />
</head>
<body class="app-body" data-page="garden">
  <div id="appHeader"></div>
  <div id="appSidebar"></div>
  <div id="sidebarOverlay" class="sidebar-overlay" hidden></div>

  <div class="app-content">
    <main class="app-main">
      <section class="plants-page" aria-labelledby="plantsPageTitle">
        <header class="garden-hero">
          <div>
            <p class="page-eyebrow">MY GARDEN</p>
            <h2 id="plantsPageTitle">我的花園</h2>
            <p>清單與圖鑑在這裡相遇。任務植物記錄今天，收藏植物記錄長期的成長。</p>
          </div>
          <a class="garden-hero__link" href="./encyclopedia.html">翻開植物圖鑑 <span aria-hidden="true">→</span></a>
        </header>

        <dl class="garden-ledger" aria-label="花園總覽">
          <div><dt>任務植物</dt><dd id="totalPlantsCount">0</dd></div>
          <div><dt>目前盛開</dt><dd id="totalBloomsCount">0</dd></div>
          <div><dt>圖鑑收藏</dt><dd><span id="collectionCount">0</span><small>/31</small></dd></div>
        </dl>

        <div class="plants-beds">
          <section class="plants-card" aria-labelledby="growingPlantsTitle">
            <header class="plants-card__header">
              <div><p class="plants-card__eyebrow">GROWING GARDEN</p><h3 id="growingPlantsTitle">還在向上生長</h3></div>
              <span id="growingPlantsCount" class="plants-card__count">0 株</span>
            </header>
            <div class="plants-bed-viewport" tabindex="0" aria-label="可橫向捲動的成長中花圃">
              <ul id="growingPlantsList" class="plants-task-list" aria-label="成長中的任務植物"></ul>
            </div>
          </section>

          <section class="plants-card" aria-labelledby="bloomPlantsTitle">
            <header class="plants-card__header">
              <div><p class="plants-card__eyebrow">BLOOMING GARDEN</p><h3 id="bloomPlantsTitle">已經迎向天空</h3></div>
              <span id="bloomPlantsCount" class="plants-card__count">0 株</span>
            </header>
            <div class="plants-bed-viewport" tabindex="0" aria-label="可橫向捲動的盛開花圃">
              <ul id="bloomPlantsList" class="plants-task-list" aria-label="已盛開的任務植物"></ul>
            </div>
          </section>
        </div>

        <aside class="garden-note">
          <p class="page-eyebrow">GARDEN NOTE</p>
          <p>目前只有雛菊與百合具備四階段 WebP 動畫；其餘植物先以圖鑑明信片記錄，待正式素材完成後再加入花園動畫。</p>
        </aside>
      </section>
    </main>
    <div id="appFooter"></div>
  </div>

  <script type="module" src="../js/app.js"></script>
  <script type="module" src="../js/pages/plants.js"></script>
</body>
</html>
