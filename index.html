<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To Bloom List</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
  <div class="container py-4">

    <header class="text-center mb-4">
      <h1>To Bloom List</h1>
      <p>Complete tasks and let your day bloom.</p>
    </header>

    <main class="row g-4">

      <!-- Left -->
      <section class="col-lg-5">
        <div class="card p-4 h-100 task-panel">
          <h2>今日任務</h2>
          <p class="task-desc">
            建議維持四項任務，每完成一項，花朵就會成長。
          </p>

          <div class="task-input-group">
            <label for="taskInput" class="visually-hidden">新增任務內容</label>
            <input id="taskInput" type="text" class="task-input" placeholder="為今天新增任務..." />
            <button id="addBtn" class="task-add-btn" type="button">+ 新增</button>
          </div>

          <p id="taskLimitMessage" class="task-limit" aria-live="polite">建議任務數：0 / 4</p>

          <ul id="taskList" class="task-list"></ul>
        </div>
      </section>

      <!-- Right -->
      <section class="col-lg-7">
        <div class="card p-4 h-100 plant-panel">
          <h2>植物狀態區</h2>
          <p class="panel-desc">進度會透過一朵花的五個成長階段呈現。</p>

          <div class="progress-card" aria-live="polite">
            <div class="progress-header">
              <span id="progressText">進度：0 / 0</span>
              <span id="progressPercent">0%</span>
            </div>
            <div class="progress mb-0">
              <div
                id="progressBar"
                class="progress-bar"
                role="progressbar"
                aria-label="任務進度"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="0"
                style="width: 0%"
              ></div>
            </div>
          </div>

          <div class="stage-info">
            <span class="stage-badge">Stage: <span id="plantStage">種子</span></span>
            <p id="stageMessage" aria-live="polite">今天，準備開始了。</p>
          </div>

          <div id="gardenBox">
            <div class="sky-glow"></div>

            <div id="rosePlant" class="rose-stage-1">

              <!-- 基底 -->
              <div class="rose-ground"></div>
              <div class="rose-pot"></div>

              <!-- 成長 -->
              <div class="rose-seed"></div>
              <div class="rose-stem"></div>

              <!-- 葉 -->
              <div class="rose-leaf rose-leaf-left"></div>
              <div class="rose-leaf rose-leaf-right"></div>

              <!-- Stage 3（保留） -->
              <div class="rose-bud rose-bud-mid"></div>

              <!-- Stage 4（關鍵修正） -->
              <div class="rose-bud-top">
                <div class="bud-base"></div>
              </div>

              <!-- Stage 5 -->
              <div class="rose-flower">
                <div class="petal petal-center"></div>
                <div class="petal petal-left"></div>
                <div class="petal petal-right"></div>
                <div class="petal petal-bottom"></div>
                <div class="petal petal-outer-left"></div>
                <div class="petal petal-outer-right"></div>
                <div class="rose-core"></div>
              </div>

            </div>
          </div>
        </div>
      </section>

    </main>

    <footer class="stage-footer mt-4">
      <div class="stage-card active">
        <div class="stage-percent">0%</div>
        <div class="stage-name">種子</div>
        <div class="stage-icon">🌰</div>
      </div>
      <div class="stage-card">
        <div class="stage-percent">25%</div>
        <div class="stage-name">發芽</div>
        <div class="stage-icon">🌱</div>
      </div>
      <div class="stage-card">
        <div class="stage-percent">50%</div>
        <div class="stage-name">葉子</div>
        <div class="stage-icon">🌷</div>
      </div>
      <div class="stage-card">
        <div class="stage-percent">75%</div>
        <div class="stage-name">花蕾</div>
        <div class="stage-icon">🌺</div>
      </div>
      <div class="stage-card">
        <div class="stage-percent">100%</div>
        <div class="stage-name">綻放</div>
        <div class="stage-icon">🌸</div>
      </div>
    </footer>

  </div>

  <script type="module" src="./js/script.js"></script>
</body>

</html>
